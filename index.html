<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harmonic Lattice Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Mapbox -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

/* Tabs */
.tab-container {
  display: flex;
  background: #222;
}
.tab {
  padding: 15px 25px;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}
.tab.active {
  background: #444;
}
.tab:hover {
  background: #333;
}

/* Content */
.section {
  display: none;
  padding: 20px;
}
.section.active {
  display: block;
}

input, select {
  width: 100%;
  padding: 8px;
  margin: 6px 0 12px 0;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

pre {
  background: #eee;
  padding: 15px;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- Tabs -->
<div class="tab-container">
  <div class="tab active" onclick="showSection('numerology')">Numerology</div>
  <div class="tab" onclick="showSection('crystals')">Crystals</div>
  <div class="tab" onclick="showSection('geocode')">Geocode & Lattice</div>
</div>

<!-- NUMEROLOGY SECTION -->
<div id="numerology" class="section active">
  <h2>Numerology & Zodiac Core</h2>

  <label>Name:</label>
  <input id="nameInput" type="text">

  <label>Birthdate:</label>
  <input id="birthInput" type="date">

  <label>Current Year:</label>
  <input id="yearInput" type="number" value="2026">

  <label>Neurotype:</label>
  <select id="neuroInput">
    <option value="ADHD">ADHD</option>
    <option value="Autism">Autism</option>
    <option value="Neurotypical">Neurotypical</option>
  </select>

  <button onclick="calcNumerology()">Calculate</button>

  <h3>Results</h3>
  <pre id="numerologyOutput"></pre>
</div>

<!-- CRYSTALS SECTION -->
<div id="crystals" class="section">
  <h2>Crystal Selection Engine</h2>

  <button onclick="runCrystalEngine()">Run Crystal Engine</button>

  <h3>Results</h3>
  <pre id="crystalOutput"></pre>
</div>

<!-- GEOCODE SECTION -->
<div id="geocode" class="section">
  <h2>Geocode & Lattice Engine</h2>

  <label>Address:</label>
  <input id="addressInput" type="text" placeholder="Enter any address">

  <label>Date for Lunar Phase:</label>
  <input id="moonDateInput" type="date">

  <button onclick="runGeocode()">Geocode & Compute Lattice</button>

  <h3>Results</h3>
  <pre id="geocodeOutput"></pre>
</div>

<script>
/* ---------------- TAB LOGIC ---------------- */
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

/* ---------------- GLOBAL STATE ---------------- */
window.HLT_State = {};

/* ---------------- NUMEROLOGY ENGINE ---------------- */
function reduceToDigit(num) {
  while (num > 9 && ![11,22,33].includes(num)) {
    num = num.toString().split('').reduce((a,b)=>a+parseInt(b),0);
  }
  return num;
}

function getZodiac(date) {
  const d = new Date(date);
  const m = d.getUTCMonth() + 1;
  const day = d.getUTCDate();

  if ((m==3 && day>=21) || (m==4 && day<=19)) return "Aries";
  if ((m==4 && day>=20) || (m==5 && day<=20)) return "Taurus";
  if ((m==5 && day>=21) || (m==6 && day<=20)) return "Gemini";
  if ((m==6 && day>=21) || (m==7 && day<=22)) return "Cancer";
  if ((m==7 && day>=23) || (m==8 && day<=22)) return "Leo";
  if ((m==8 && day>=23) || (m==9 && day<=22)) return "Virgo";
  if ((m==9 && day>=23) || (m==10 && day<=22)) return "Libra";
  if ((m==10 && day>=23) || (m==11 && day<=21)) return "Scorpio";
  if ((m==11 && day>=22) || (m==12 && day<=21)) return "Sagittarius";
  if ((m==12 && day>=22) || (m==1 && day<=19)) return "Capricorn";
  if ((m==1 && day>=20) || (m==2 && day<=18)) return "Aquarius";
  return "Pisces";
}

function zodiacMod(z) {
  if (["Pisces","Cancer"].includes(z)) return 0.15;
  if (["Aries","Leo"].includes(z)) return 0.10;
  if (["Virgo","Capricorn"].includes(z)) return 0.05;
  return 0.00;
}

function sensitivityCoefficient(neuro) {
  if (neuro==="ADHD") return 1.38;
  if (neuro==="Autism") return 1.42;
  return 1.00;
}

function calcNumerology() {
  const name = document.getElementById("nameInput").value.trim();
  const birth = document.getElementById("birthInput").value;
  const year = parseInt(document.getElementById("yearInput").value);
  const neuro = document.getElementById("neuroInput").value;

  if (!name || !birth) {
    document.getElementById("numerologyOutput").textContent = "Please enter name and birthdate.";
    return;
  }

  const digits = birth.replace(/-/g,"").split("").map(Number);
  const sumDigits = digits.reduce((a,b)=>a+b,0);
  const lifePath = reduceToDigit(sumDigits);

  const zodiac = getZodiac(birth);
  const zMod = zodiacMod(zodiac);
  const sens = sensitivityCoefficient(neuro);

  window.HLT_State.numerology = {
    name,
    birthdate: birth,
    zodiac,
    zodiacMod: zMod,
    sensitivityCoefficient: sens,
    H: sens,
    C: sens + 0.04,
    P: sens - 0.17,
    lifePath,
    year,
    neurotype: neuro
  };

  document.getElementById("numerologyOutput").textContent =
    JSON.stringify(window.HLT_State.numerology, null, 2);
}

/* ---------------- CRYSTAL ENGINE ---------------- */
const crystalTable = [
  { name: "Amethyst", X: 0.82, Y: 0.91 },
  { name: "Rose Quartz", X: 0.77, Y: 0.88 },
  { name: "Black Tourmaline", X: 0.93, Y: 0.74 },
  { name: "Citrine", X: 0.69, Y: 0.95 },
  { name: "Labradorite", X: 0.88, Y: 0.79 },
  { name: "Selenite", X: 0.91, Y: 0.83 }
];

function runCrystalEngine() {
  const n = window.HLT_State.numerology;
  if (!n) {
    document.getElementById("crystalOutput").textContent =
      "Run Numerology first.";
    return;
  }

  const results = crystalTable.map(c => {
    const score = (c.X * n.H) + (c.Y * n.C) - (0.3 * n.P);
    return { crystal: c.name, score };
  });

  results.sort((a,b)=>b.score - a.score);

  window.HLT_State.crystals = results.slice(0,4);

  document.getElementById("crystalOutput").textContent =
    JSON.stringify(window.HLT_State.crystals, null, 2);
}

/* ---------------- GEOCODE + LATTICE ENGINE ---------------- */
mapboxgl.accessToken = "pk.eyJ1IjoiaHJoYXJ0bWFuMjIiLCJhIjoiY210NnA2YXo2MjB4aTJ5cHo0cnA3Y2VzNiJ9.0xwj-LhOmdIqhInOm1NqIA";

/* Facility Harmonic Signatures */
const FacilityS1 = [0.82, -0.35, 0.12, 0.56, -0.68, 0.91, -0.49];
const FacilityS2 = [0.41, 0.77, -0.93, 0.64, -0.22, -0.09, 0.87];

/* Lunar Phase */
function computeLunarPhase(dateStr) {
  const d = new Date(dateStr);
  const base = new Date(2000, 0, 6);
  const days = (d - base) / (1000 * 60 * 60 * 24);
  const phase = ((days / 29.530588853) % 1 + 1) % 1;
  return phase;
}

function phaseName(phase) {
  if (phase < 0.03 || phase > 0.97) return "New Moon";
  if (phase < 0.22) return "Waxing Crescent";
  if (phase < 0.28) return "First Quarter";
  if (phase < 0.47) return "Waxing Gibbous";
  if (phase < 0.53) return "Full Moon";
  if (phase < 0.72) return "Waning Gibbous";
  if (phase < 0.78) return "Last Quarter";
  return "Waning Crescent";
}

/* Lattice Value */
function computeLatticeValue(lat, lng, lunarPhase) {
  const angles = [0,0.4,0.8,1.2,1.6,2,2.4];
  const factor = 3 * Math.cos(lat * Math.PI/180) * Math.sin(lng * Math.PI/180);

  let sum = 0;
  for (let i = 0; i < 7; i++) {
    const term = Math.cos(2 * Math.PI * lunarPhase + angles[i]) * factor;
    sum += FacilityS1[i] * term;
  }
  return sum / 7;
}

/* Corridor Density */
function computeCorridorDensity(lat, lng, lunarPhase) {
  const angles = [0.15,0.55,0.95,1.35,1.75,2.15,2.55];
  const factor = 5 * Math.cos(lat * Math.PI/180) * Math.sin(lng * Math.PI/180);

  let sum = 0;
  for (let i = 0; i < 7; i++) {
    const term = Math.sin(2 * Math.PI * lunarPhase + angles[i]) * factor;
    sum += FacilityS2[i] * term;
  }
  return sum;
}

/* Consciousness Propagation */
function computeConsciousnessPropagation(corridorDensity, latticeValue) {
  return corridorDensity / (1 + Math.abs(latticeValue));
}

/* Main Geocode Engine */
async function runGeocode() {
  const addr = document.getElementById("addressInput").value.trim();
  const moonDate = document.getElementById("moonDateInput").value || new Date().toISOString().slice(0,10);

  if (!addr) {
    document.getElementById("geocodeOutput").textContent = "Enter an address.";
    return;
  }

  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(addr)}.json?access_token=${mapboxgl.accessToken}`;

  const res = await fetch(url);
  const data = await res.json();

  if (!data.features || data.features.length === 0) {
    document.getElementById("geocodeOutput").textContent = "No results.";
    return;
  }

  const f = data.features[0];
  const [lng, lat] = f.center;

  const lunarPhase = computeLunarPhase(moonDate);
  const latticeValue = computeLatticeValue(lat, lng, lunarPhase);
  const corridorDensity = computeCorridorDensity(lat, lng, lunarPhase);
  const consciousnessPropagation = computeConsciousnessPropagation(corridorDensity, latticeValue);
  const lunarPhaseName = phaseName(lunarPhase);

  window.HLT_State.geocode = {
    address: addr,
    lat,
    lng,
    latticeValue,
    corridorDensity,
    consciousnessPropagation,
    lunarPhase,
    lunarPhaseName,
    moonDate
  };

  document.getElementById("geocodeOutput").textContent =
    JSON.stringify(window.HLT_State.geocode, null, 2);
}
</script>

</body>
</html>
